<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Managerku.id - Admin Dashboard</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#006948',
            primarySoft: '#86f8c2',
            primaryDim: '#69dba8',
            primaryContainer: '#00855b',
            secondary: '#1f6d00',
            secondarySoft: '#8ffc67',
            background: '#f4fbf9',
            surface: '#ffffff',
            surfaceLow: '#eef5f3',
            surfaceMid: '#e8efed',
            surfaceHigh: '#dde4e2',
            dark: '#161d1c',
            darkSoft: '#3d4a42',
            inverse: '#2b3231',
            outline: '#bccac0',
            outlineDark: '#6d7a72',
            error: '#ba1a1a',
            errorSoft: '#ffdad6',
            warning: '#b45309',
            warningSoft: '#fffbeb'
          },
          borderRadius: {
            card: '24px'
          },
          fontFamily: {
            jakarta: ['Plus Jakarta Sans', 'sans-serif']
          },
          boxShadow: {
            card: '0 30px 60px -12px rgba(5, 26, 19, 0.08)',
            soft: '0 12px 40px rgba(5, 26, 19, 0.08)',
            button: '0 18px 30px -10px rgba(0, 105, 72, 0.35)'
          }
        }
      }
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: #f4fbf9;
      color: #161d1c;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    #root {
      min-height: 100dvh;
    }

    @supports not (height: 100dvh) {
      body,
      #root {
        min-height: 100vh;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drawerSlide {
      from {
        opacity: 0;
        transform: translateX(-18px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes toastSlide {
      from {
        opacity: 0;
        transform: translateX(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes spinSoft {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseRadar {
      0% {
        transform: scale(0.8);
        opacity: 0.45;
      }

      70% {
        transform: scale(1.35);
        opacity: 0;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.33);
        opacity: 0;
      }

      50% {
        opacity: 0.5;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-drawer {
      animation: drawerSlide 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-toast {
      animation: toastSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .spin-soft {
      animation: spinSoft 0.9s linear infinite;
    }

    .natural-overlay {
      background: rgba(6, 19, 15, 0.16);
      backdrop-filter: blur(2px);
    }

    .modal-card-soft {
      box-shadow: 0 16px 40px -24px rgba(5, 26, 19, 0.35);
    }

    .modal-form-scroll {
      max-height: min(72dvh, 720px);
      overflow-y: auto;
    }

    @supports not (height: 100dvh) {
      .modal-form-scroll {
        max-height: min(72vh, 720px);
      }
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 30px rgba(5, 26, 19, 0.04);
    }

    .map-pulse {
      animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }

    .radar-pulse::before,
    .radar-pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 1px solid rgba(0, 105, 72, 0.35);
      animation: pulseRadar 2s infinite;
    }

    .radar-pulse::after {
      animation-delay: 0.8s;
    }

    .input-glow:focus {
      box-shadow: 0 0 0 4px rgba(0, 105, 72, 0.1);
    }

    .table-scroll::-webkit-scrollbar,
    .fixed-grid-scroll::-webkit-scrollbar,
    .modal-form-scroll::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    .table-scroll::-webkit-scrollbar-thumb,
    .fixed-grid-scroll::-webkit-scrollbar-thumb,
    .modal-form-scroll::-webkit-scrollbar-thumb {
      background: #bccac0;
      border-radius: 999px;
    }

    .table-scroll::-webkit-scrollbar-track,
    .fixed-grid-scroll::-webkit-scrollbar-track,
    .modal-form-scroll::-webkit-scrollbar-track {
      background: rgba(232, 239, 237, 0.65);
      border-radius: 999px;
    }

    .fixed-grid-box {
      height: min(640px, calc(100dvh - 290px));
      min-height: 420px;
      overflow: auto;
    }

    .fixed-board-column {
      height: min(620px, calc(100dvh - 340px));
      min-height: 420px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    @supports not (height: 100dvh) {
      .fixed-grid-box {
        height: min(640px, calc(100vh - 290px));
      }

      .fixed-board-column {
        height: min(620px, calc(100vh - 340px));
      }
    }

    .sticky-table-head th {
      position: sticky;
      top: 0;
      z-index: 12;
    }

    .employee-row-actions {
      opacity: 0;
      transform: translateX(6px);
      transition: all 0.2s ease;
    }

    tr:hover .employee-row-actions {
      opacity: 1;
      transform: translateX(0);
    }

    .manager-card-actions {
      opacity: 0.88;
      transform: translateY(0);
      transition: all 0.22s ease;
    }

    .manager-card:hover .manager-card-actions {
      opacity: 1;
      transform: translateY(-1px);
    }

    .AdminInput {
      width: 100%;
      border-radius: 0.75rem;
      border: 1px solid rgba(188, 202, 192, 0.8);
      background: #fbfffd;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      outline: none;
    }

    .AdminInput:focus {
      border-color: #006948;
      box-shadow: 0 0 0 4px rgba(0, 105, 72, 0.1);
    }

    .AdminInput:disabled {
      background: #eef5f3;
      color: #3d4a42;
      opacity: 0.75;
    }

    @media (max-width: 768px) {
      .employee-row-actions,
      .manager-card-actions {
        opacity: 1;
        transform: none;
      }

      .fixed-grid-box {
        height: min(560px, calc(100dvh - 250px));
        min-height: 340px;
      }

      .fixed-board-column {
        height: 430px;
        min-height: 320px;
      }

      .modal-form-scroll {
        max-height: calc(100dvh - 190px);
      }
    }

    @media (max-width: 480px) {
      .fixed-grid-box {
        height: min(520px, calc(100dvh - 235px));
        min-height: 320px;
      }

      .fixed-board-column {
        height: 390px;
        min-height: 300px;
      }

      .modal-form-scroll {
        max-height: calc(100dvh - 170px);
      }
    }
  </style>
</head>

<body class="text-dark min-h-[100dvh] overflow-x-hidden">
  <div id="root" class="min-h-[100dvh]"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const ADMIN_SESSION_KEY = 'managerku_admin_session';

    /**
     * Paste your deployed Google Apps Script Web App URL here.
     * Example:
     * const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxxxx/exec';
     */
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyUHLq8X0qI7PCYMye414v9JFaK7e8o2x6anahYu_AR47e2bDxukzOJfgCvHvzyJcEpkg/exec';

    const INDEX_PAGE_URL = './index.html';

    const EMPTY_EMPLOYEE = {
      employeeId: '',
      employeeName: '',
      email: '',
      phone: '',
      position: '',
      department: '',
      status: 'Active'
    };

    const EMPTY_GEOFENCING = {
      geoId: '',
      locationName: '',
      address: '',
      latitude: '',
      longitude: '',
      radiusMeter: '',
      status: 'Active'
    };

    const EMPTY_MANAGER = {
      managerId: '',
      managerName: '',
      email: '',
      password: '',
      role: 'Manager',
      status: 'Active'
    };

    function App() {
      const [session, setSession] = useState(null);
      const [activeTab, setActiveTab] = useState('attendance');
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [message, setMessage] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      const [employees, setEmployees] = useState([]);
      const [geofencing, setGeofencing] = useState([]);
      const [attendanceLogs, setAttendanceLogs] = useState([]);
      const [managerAccounts, setManagerAccounts] = useState([]);

      const [employeeForm, setEmployeeForm] = useState(EMPTY_EMPLOYEE);
      const [geoForm, setGeoForm] = useState(EMPTY_GEOFENCING);
      const [managerForm, setManagerForm] = useState(EMPTY_MANAGER);
      const [editingEmployeeId, setEditingEmployeeId] = useState('');
      const [editingGeoId, setEditingGeoId] = useState('');
      const [editingManagerId, setEditingManagerId] = useState('');
      const [showEmployeeForm, setShowEmployeeForm] = useState(false);
      const [showManagerForm, setShowManagerForm] = useState(false);

      const [search, setSearch] = useState('');
      const [attendanceDate, setAttendanceDate] = useState('');
      const [attendanceViewMode, setAttendanceViewMode] = useState('board');
      const [employeeStatusFilter, setEmployeeStatusFilter] = useState('All');
      const [managerStatusFilter, setManagerStatusFilter] = useState('All');

      useEffect(() => {
        const rawSession = localStorage.getItem(ADMIN_SESSION_KEY);

        if (!rawSession) {
          setLoading(false);
          return;
        }

        try {
          setSession(JSON.parse(rawSession));
        } catch (err) {
          localStorage.removeItem(ADMIN_SESSION_KEY);
        }

        setLoading(false);
      }, []);

      useEffect(() => {
        if (session) {
          loadDashboard();
        }
      }, [session]);

      function isApiConfigured() {
        return GAS_API_URL && GAS_API_URL !== 'PASTE_YOUR_DEPLOYED_GAS_WEB_APP_URL_HERE';
      }

      async function apiRequest(action, payload = {}) {
        if (!isApiConfigured()) {
          throw new Error('GAS_API_URL belum diisi. Paste URL Web App Google Apps Script terlebih dahulu.');
        }

        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action,
            payload
          })
        });

        if (!response.ok) {
          throw new Error(`API request gagal. Status: ${response.status}`);
        }

        const result = await response.json();

        if (!result) {
          throw new Error('Response API kosong.');
        }

        return result;
      }

      function notify(type, title, text) {
        const id = Date.now() + Math.random();

        setToasts(prev => [
          ...prev,
          {
            id,
            type,
            title,
            text
          }
        ]);

        setTimeout(() => {
          setToasts(prev => prev.filter(item => item.id !== id));
        }, 3800);
      }

      function showMessage(type, text) {
        setMessage({ type, text });

        setTimeout(() => {
          setMessage(null);
        }, 3000);
      }

      async function loadDashboard() {
        setLoading(true);

        try {
          const response = await apiRequest('getAdminDashboardData');

          setLoading(false);

          if (!response || !response.success) {
            showMessage('error', response?.message || 'Gagal memuat dashboard.');
            notify('error', 'Dashboard Error', response?.message || 'Gagal memuat dashboard.');
            return;
          }

          setEmployees(response.data.employees || []);
          setGeofencing(response.data.geofencing || []);
          setAttendanceLogs(response.data.attendanceLogs || []);
          setManagerAccounts(response.data.managerAccounts || []);

        } catch (error) {
          setLoading(false);
          showMessage('error', error?.message || 'Server error saat memuat dashboard.');
          notify('error', 'Server Error', error?.message || 'Server error saat memuat dashboard.');
        }
      }

      function logout() {
        localStorage.removeItem(ADMIN_SESSION_KEY);
        window.location.href = INDEX_PAGE_URL;
      }

      function changeTab(id) {
        setActiveTab(id);
        setSearch('');
        setSidebarOpen(false);
      }

      function getTodayString() {
        return new Date().toISOString().slice(0, 10);
      }

      function getCurrentMonthString() {
        return new Date().toISOString().slice(0, 7);
      }

      function getInitials(name) {
        const cleanName = String(name || '-').trim();

        if (!cleanName || cleanName === '-') return 'MJ';

        const parts = cleanName.split(' ').filter(Boolean);

        if (parts.length === 1) {
          return parts[0].slice(0, 2).toUpperCase();
        }

        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function normalizeId(value) {
        return String(value || '').trim().toLowerCase();
      }

      function isDuplicateEmployeeId(employeeId) {
        const cleanId = normalizeId(employeeId);

        if (!cleanId) return false;

        return employees.some(item => normalizeId(item.employeeId) === cleanId);
      }

      function parseTimeToMinutes(time) {
        const cleanTime = String(time || '').trim();

        if (!cleanTime) return null;

        const parts = cleanTime.split(':');

        if (parts.length < 2) return null;

        const hour = Number(parts[0]);
        const minute = Number(parts[1]);

        if (isNaN(hour) || isNaN(minute)) return null;

        return hour * 60 + minute;
      }

      function isLate(item) {
        const checkInMinutes = parseTimeToMinutes(item.checkInTime);
        const lateThreshold = 9 * 60;

        if (checkInMinutes === null) return false;

        return checkInMinutes > lateThreshold;
      }

      function getLateMinutes(item) {
        const checkInMinutes = parseTimeToMinutes(item.checkInTime);
        const lateThreshold = 9 * 60;

        if (checkInMinutes === null) return 0;

        return Math.max(0, checkInMinutes - lateThreshold);
      }

      function getGeoMapSrc() {
        const lat = Number(geoForm.latitude || 0);
        const lng = Number(geoForm.longitude || 0);

        if (!lat || !lng) {
          return 'https://www.openstreetmap.org/export/embed.html?bbox=109.2900%2C-0.0800%2C109.3900%2C0.0200&layer=mapnik';
        }

        const delta = 0.01;
        const left = lng - delta;
        const right = lng + delta;
        const top = lat + delta;
        const bottom = lat - delta;

        return `https://www.openstreetmap.org/export/embed.html?bbox=${left}%2C${bottom}%2C${right}%2C${top}&layer=mapnik&marker=${lat}%2C${lng}`;
      }

      function useCurrentLocationForGeo() {
        if (!navigator.geolocation) {
          notify('error', 'GPS Tidak Tersedia', 'Browser ini tidak mendukung geolocation.');
          return;
        }

        notify('success', 'Mengambil Lokasi', 'Mohon tunggu sebentar, sistem sedang mengambil titik GPS.');

        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);

            setGeoForm(prev => ({
              ...prev,
              latitude: lat,
              longitude: lng
            }));

            notify('success', 'Lokasi Terdeteksi', `Koordinat berhasil diisi: ${lat}, ${lng}`);
          },
          error => {
            notify('error', 'Gagal Ambil Lokasi', error?.message || 'Tidak bisa mengambil lokasi perangkat.');
          },
          {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0
          }
        );
      }

      function getFilteredAttendanceLogs() {
        const keyword = search.trim().toLowerCase();

        return attendanceLogs.filter(item => {
          const matchSearch =
            !keyword ||
            String(item.employeeId || '').toLowerCase().includes(keyword) ||
            String(item.employeeName || '').toLowerCase().includes(keyword) ||
            String(item.email || '').toLowerCase().includes(keyword) ||
            String(item.locationName || '').toLowerCase().includes(keyword) ||
            String(item.attendanceStatus || '').toLowerCase().includes(keyword);

          const matchDate =
            !attendanceDate ||
            String(item.date || '') === attendanceDate;

          return matchSearch && matchDate;
        });
      }

      function getTodayLogs() {
        const today = attendanceDate || getTodayString();

        return attendanceLogs.filter(item => String(item.date || '') === today);
      }

      function getPresentLogs() {
        return getFilteredAttendanceLogs().filter(item => {
          const status = String(item.attendanceStatus || '').toLowerCase();
          return status === 'checked in' || status === 'completed';
        });
      }

      function getLateLogs() {
        return getFilteredAttendanceLogs().filter(item => isLate(item));
      }

      function getCompletedLogs() {
        return getFilteredAttendanceLogs().filter(item => {
          const status = String(item.attendanceStatus || '').toLowerCase();
          return status === 'completed';
        });
      }

      function getAbsentEmployees() {
        const targetDate = attendanceDate || getTodayString();

        const attendedIds = attendanceLogs
          .filter(log => String(log.date || '') === targetDate)
          .map(log => String(log.employeeId || '').trim());

        return employees.filter(employee => {
          const isActive = String(employee.status || '').toLowerCase() === 'active';
          return isActive && !attendedIds.includes(String(employee.employeeId || '').trim());
        });
      }

      const filteredEmployees = useMemo(() => {
        const keyword = search.trim().toLowerCase();

        return employees.filter(item => {
          const matchKeyword =
            !keyword ||
            String(item.employeeId || '').toLowerCase().includes(keyword) ||
            String(item.employeeName || '').toLowerCase().includes(keyword) ||
            String(item.email || '').toLowerCase().includes(keyword) ||
            String(item.phone || '').toLowerCase().includes(keyword) ||
            String(item.position || '').toLowerCase().includes(keyword) ||
            String(item.department || '').toLowerCase().includes(keyword);

          const matchStatus =
            employeeStatusFilter === 'All' ||
            String(item.status || '').toLowerCase() === employeeStatusFilter.toLowerCase();

          return matchKeyword && matchStatus;
        });
      }, [employees, search, employeeStatusFilter]);

      const filteredGeofencing = useMemo(() => {
        const keyword = search.trim().toLowerCase();

        return geofencing.filter(item => {
          if (!keyword) return true;

          return (
            String(item.geoId || '').toLowerCase().includes(keyword) ||
            String(item.locationName || '').toLowerCase().includes(keyword) ||
            String(item.address || '').toLowerCase().includes(keyword)
          );
        });
      }, [geofencing, search]);

      const filteredManagers = useMemo(() => {
        const keyword = search.trim().toLowerCase();

        return managerAccounts.filter(item => {
          const matchKeyword =
            !keyword ||
            String(item.managerId || '').toLowerCase().includes(keyword) ||
            String(item.managerName || '').toLowerCase().includes(keyword) ||
            String(item.email || '').toLowerCase().includes(keyword) ||
            String(item.role || '').toLowerCase().includes(keyword) ||
            String(item.status || '').toLowerCase().includes(keyword);

          const matchStatus =
            managerStatusFilter === 'All' ||
            String(item.status || '').toLowerCase() === managerStatusFilter.toLowerCase();

          return matchKeyword && matchStatus;
        });
      }, [managerAccounts, search, managerStatusFilter]);

      const employeeStats = useMemo(() => {
        const activeEmployees = employees.filter(item => String(item.status || '').toLowerCase() === 'active');
        const inactiveEmployees = employees.filter(item => String(item.status || '').toLowerCase() === 'inactive');
        const currentMonth = getCurrentMonthString();

        const newThisMonth = employees.filter(item => {
          const createdAt = String(item.createdAt || '');
          return createdAt.slice(0, 7) === currentMonth;
        });

        return {
          total: employees.length,
          active: activeEmployees.length,
          inactive: inactiveEmployees.length,
          newThisMonth: newThisMonth.length
        };
      }, [employees]);

      const managerStats = useMemo(() => {
        const activeManagers = managerAccounts.filter(item => String(item.status || '').toLowerCase() === 'active');
        const inactiveManagers = managerAccounts.filter(item => String(item.status || '').toLowerCase() !== 'active');
        const fullAccessManagers = managerAccounts.filter(item => {
          const role = String(item.role || '').toLowerCase();
          return role.includes('admin') || role.includes('owner') || role.includes('full');
        });

        return {
          total: managerAccounts.length,
          active: activeManagers.length,
          fullAccess: fullAccessManagers.length,
          restricted: inactiveManagers.length
        };
      }, [managerAccounts]);

      function handleGeoChange(field, value) {
        setGeoForm(prev => ({
          ...prev,
          [field]: value
        }));
      }

      function openAddEmployeeForm() {
        resetEmployeeForm();
        setShowEmployeeForm(true);
      }

      function editEmployee(item) {
        setEditingEmployeeId(item.employeeId);
        setEmployeeForm({
          employeeId: item.employeeId || '',
          employeeName: item.employeeName || '',
          email: item.email || '',
          phone: item.phone || '',
          position: item.position || '',
          department: item.department || '',
          status: item.status || 'Active'
        });
        setShowEmployeeForm(true);
      }

      function resetEmployeeForm() {
        setEditingEmployeeId('');
        setEmployeeForm({
          ...EMPTY_EMPLOYEE
        });
      }

      function closeEmployeeForm() {
        if (saving) return;

        resetEmployeeForm();
        setShowEmployeeForm(false);
      }

      async function saveEmployee(e) {
        e.preventDefault();

        const formData = new FormData(e.currentTarget);
        const isEditing = Boolean(editingEmployeeId);

        const nextEmployeeForm = {
          employeeId: String(formData.get('employeeId') || '').trim(),
          employeeName: String(formData.get('employeeName') || '').trim(),
          email: String(formData.get('email') || '').trim(),
          phone: String(formData.get('phone') || '').trim(),
          position: String(formData.get('position') || '').trim(),
          department: String(formData.get('department') || '').trim(),
          status: String(formData.get('status') || 'Active').trim()
        };

        if (!nextEmployeeForm.employeeId) {

        const activeEmployees = employees.filter(item => String(item.status || '').toLowerCase() === 'active');

              renderManagerEmptyState()
            )}

            <div className="mt-4 flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between">
              <p className="text-sm text-darkSoft">
                Showing <span className="font-black text-dark">{filteredManagers.length}</span> of <span className="font-black text-dark">{managerAccounts.length}</span> Managers
              </p>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  disabled
                  className="w-10 h-10 rounded-xl bg-surfaceLow flex items-center justify-center text-darkSoft disabled:opacity-50"
                >
                  <span className="material-symbols-outlined">chevron_left</span>
                </button>
                <button
                  type="button"
                  className="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center font-black"
                >
                  1
                </button>
                <button
                  type="button"
                  disabled
                  className="w-10 h-10 rounded-xl bg-white border border-outline/30 flex items-center justify-center text-darkSoft disabled:opacity-50"
                >
                  <span className="material-symbols-outlined">chevron_right</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      function renderManagerFormModal() {
        const isEditing = Boolean(editingManagerId);

        return (
          <div className="fixed inset-0 z-[90] flex items-start sm:items-center justify-center px-3 sm:px-5 py-4 sm:py-8 bg-white/35 backdrop-blur-[2px] overflow-y-auto">
            <div className="w-full max-w-[980px] max-h-[calc(100dvh-2rem)] bg-white rounded-[24px] sm:rounded-[32px] modal-card-soft border border-outline/20 overflow-hidden">
              <div className="p-4 sm:p-6 md:p-8 border-b border-outline/20 flex items-start justify-between gap-3 sm:gap-4 bg-white">
                <div className="flex items-start gap-3 sm:gap-4">
                  <div className="h-12 w-12 sm:h-14 sm:w-14 rounded-2xl bg-primary text-white flex items-center justify-center shadow-button shrink-0">
                    <span className="material-symbols-outlined" style={{ fontVariationSettings: "'FILL' 1" }}>
                      {isEditing ? 'manage_accounts' : 'person_add'}
                    </span>
                  </div>

                  <div>
                    <p className="text-xs font-black text-primary tracking-[0.18em] uppercase">
                      Manager Account
                    </p>
                    <h3 className="mt-1 text-xl sm:text-2xl md:text-3xl font-black tracking-[-0.03em] text-dark">
                      {isEditing ? 'Edit Manager' : 'Create Manager'}
                    </h3>
                    <p className="mt-1 text-sm text-darkSoft">
                      {isEditing
                        ? 'Update data manager. Kosongkan password jika tidak ingin mengubah password lama.'
                        : 'Tambahkan manager baru untuk akses admin dashboard.'}
                    </p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={closeManagerForm}
                  disabled={saving}
                  className="h-11 w-11 rounded-full bg-surfaceLow border border-outline/30 text-darkSoft flex items-center justify-center hover:bg-surfaceHigh transition disabled:opacity-60 shrink-0"
                >
                  <span className="material-symbols-outlined">close</span>
                </button>
              </div>

              <div className="modal-form-scroll p-4 sm:p-6 md:p-8">
                <form onSubmit={saveManager} className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                  {renderField('Manager ID',
                    <input
                      name="managerId"
                      defaultValue={managerForm.managerId || ''}
                      disabled={Boolean(editingManagerId) || saving}
                      required
                      className="AdminInput"
                      placeholder="MGR-001"
                    />
                  )}

                  {renderField('Manager Name',
                    <input
                      name="managerName"
                      defaultValue={managerForm.managerName || ''}
                      disabled={saving}
                      required
                      className="AdminInput"
                      placeholder="Nama manager"
                    />
                  )}

                  {renderField('Email',
                    <input
                      name="email"
                      type="email"
                      defaultValue={managerForm.email || ''}
                      disabled={saving}
                      required
                      className="AdminInput"
                      placeholder="manager@email.com"
                    />
                  )}

                  {renderField(isEditing ? 'New Password Optional' : 'Password',
                    <input
                      name="password"
                      type="password"
                      defaultValue=""
                      disabled={saving}
                      required={!isEditing}
                      className="AdminInput"
                      placeholder={isEditing ? 'Kosongkan jika tidak diubah' : 'Password manager'}
                    />
                  )}

                  {renderField('Role',
                    <input
                      name="role"
                      defaultValue={managerForm.role || 'Manager'}
                      disabled={saving}
                      className="AdminInput"
                      placeholder="Manager"
                    />
                  )}

                  {renderField('Status',
                    <select
                      name="status"
                      defaultValue={managerForm.status || 'Active'}
                      disabled={saving}
                      className="AdminInput"
                    >
                      <option value="Active">Active</option>
                      <option value="Inactive">Inactive</option>
                    </select>
                  )}

                  <div className="sm:col-span-2 xl:col-span-3 flex flex-col sm:flex-row gap-3 sm:justify-end pt-2">
                    <button
                      type="button"
                      onClick={closeManagerForm}
                      disabled={saving}
                      className="rounded-xl bg-surfaceLow border border-outline/40 text-dark py-3 px-5 sm:px-6 font-black disabled:opacity-60"
                    >
                      Cancel
                    </button>

                    <button
                      type="submit"
                      disabled={saving}
                      className="rounded-xl bg-primary text-white py-3 px-6 sm:px-8 font-black flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
                    >
                      <span className={saving ? 'material-symbols-outlined text-base spin-soft' : 'material-symbols-outlined text-base'}>
                        {saving ? 'progress_activity' : 'save'}
                      </span>
                      {saving ? 'Saving...' : isEditing ? 'Update Manager' : 'Create Manager'}
                    </button>
                  </div>
                </form>

                <div className="mt-6 rounded-2xl border border-outline/30 bg-surfaceLow p-4 flex gap-3">
                  <span className="material-symbols-outlined text-primary shrink-0" style={{ fontVariationSettings: "'FILL' 1" }}>
                    info
                  </span>
                  <p className="text-xs leading-relaxed text-darkSoft font-semibold">
                    Password manager tidak ditampilkan ke frontend. Saat edit, password boleh dikosongkan agar password lama tetap dipakai.
                  </p>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function renderManagerStats() {
        const stats = [
          {
            label: 'Total Managers',
            value: managerStats.total,
            icon: 'person',
            iconClass: 'bg-primary/10 text-primary'
          },
          {
            label: 'Active Now',
            value: managerStats.active,
            icon: 'verified_user',
            iconClass: 'bg-secondary/10 text-secondary'
          },
          {
            label: 'Full Access',
            value: managerStats.fullAccess,
            icon: 'lock_open',
            iconClass: 'bg-darkSoft/10 text-darkSoft'
          },
          {
            label: 'Restricted',
            value: managerStats.restricted,
            icon: 'security',
            iconClass: 'bg-errorSoft/40 text-error'
          }
        ];

        return (
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 sm:gap-6">
            {stats.map((item, index) => (
              <div
                key={item.label}
                className="bg-white p-6 rounded-[24px] shadow-card border border-outline/20 flex items-center gap-4"
                style={{ animationDelay: `${index * 100}ms` }}
              >
                <div className={'w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ' + item.iconClass}>
                  <span className="material-symbols-outlined">{item.icon}</span>
                </div>
                <div>
                  <p className="text-darkSoft text-sm font-semibold">{item.label}</p>
                  <p className="text-3xl font-black tracking-[-0.04em] text-dark">{item.value}</p>
                </div>
              </div>
            ))}
          </div>
        );
      }

      function renderManagerCard(item, index) {
        const isActive = String(item.status || '').toLowerCase() === 'active';
        const managerName = item.managerName || item.name || '-';
        const managerId = item.managerId || item.id || '-';
        const managerEmail = item.email || '-';
        const managerRole = item.role || 'Manager';
        const createdAt = item.createdAt || '-';
        const roleTags = String(managerRole || 'Manager')
          .split(/[,\|/]+/)
          .map(role => role.trim())
          .filter(Boolean);

        return (
          <div
            key={managerId}
            className="manager-card bg-white rounded-[22px] sm:rounded-[24px] shadow-card border border-outline/20 overflow-hidden group hover:border-primary/30 transition-all duration-300"
            style={{ animationDelay: `${index * 80}ms` }}
          >
            <div className="p-5 sm:p-6">
              <div className="flex items-start justify-between mb-4 gap-4">
                <div className="flex items-center gap-4 min-w-0">
                  <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-primary/15 to-primaryDim/25 text-primary flex items-center justify-center font-black text-base sm:text-lg shrink-0">
                    {getInitials(managerName)}
                  </div>

                  <div className="min-w-0">
                    <h3 className="text-lg font-black text-dark truncate">
                      {managerName}
                    </h3>
                    <p className="text-sm text-darkSoft truncate">
                      ID: {managerId}
                    </p>
                  </div>
                </div>

                <div className="flex flex-col items-end gap-2 shrink-0">
                  <span
                    className={
                      isActive
                        ? 'px-3 py-1 rounded-full bg-secondarySoft/40 text-secondary text-[10px] font-black uppercase tracking-wider'
                        : 'px-3 py-1 rounded-full bg-surfaceHigh text-darkSoft text-[10px] font-black uppercase tracking-wider'
                    }
                  >
                    {isActive ? 'Active' : item.status || 'Offline'}
                  </span>
                </div>
              </div>

              <div className="space-y-3 mb-6">
                <div className="flex items-center gap-3 text-darkSoft">
                  <span className="material-symbols-outlined text-[18px]">mail</span>
                  <span className="text-sm font-semibold truncate">{managerEmail}</span>
                </div>

                <div className="flex items-start gap-3 text-darkSoft">
                  <span className="material-symbols-outlined text-[18px] mt-0.5">verified_user</span>
                  <div className="flex flex-wrap gap-1">
                    {roleTags.length ? (
                      roleTags.map(role => (
                        <span
                          key={role}
                          className="px-2 py-0.5 rounded-lg bg-surfaceLow text-[11px] font-black text-darkSoft"
                        >
                          {role}
                        </span>
                      ))
                    ) : (
                      <span className="px-2 py-0.5 rounded-lg bg-surfaceLow text-[11px] font-black text-darkSoft">
                        Manager
                      </span>
                    )}
                  </div>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between pt-4 border-t border-outline/20 gap-3 sm:gap-4">
                <p className="text-xs text-darkSoft italic truncate">
                  Created: {createdAt}
                </p>

                <div className="manager-card-actions flex gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={() => editManager(item)}
                    className="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 text-primary transition-all active:scale-90"
                    title="Edit Manager"
                  >
                    <span className="material-symbols-outlined">edit</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => deleteManager(managerId)}
                    className="w-10 h-10 flex items-center justify-center rounded-full hover:bg-error/10 text-error transition-all active:scale-90"
                    title="Delete Manager"
                  >
                    <span className="material-symbols-outlined">delete</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function renderManagerEmptyState() {
        return (
          <div className="col-span-full flex flex-col items-center justify-center py-14 sm:py-20 px-5 bg-white/70 border-2 border-dashed border-outline/50 rounded-[24px] sm:rounded-[32px]">
            <div className="w-20 h-20 bg-surfaceLow flex items-center justify-center rounded-full mb-6">
              <span className="material-symbols-outlined text-4xl text-darkSoft/40">search_off</span>
            </div>
            <h4 className="text-lg font-black mb-2">No managers found</h4>
            <p className="text-darkSoft max-w-xs text-center mb-8 text-sm">
              Tidak ada manager account yang cocok dengan filter/search saat ini.
            </p>
            <button
              type="button"
              onClick={() => {
                setSearch('');
                setManagerStatusFilter('All');
              }}
              className="px-8 h-12 bg-gradient-to-r from-primary to-secondary text-white font-black rounded-xl active:scale-95 transition-all"
            >
              Reset Filter
            </button>
          </div>
        );
      }

      function renderActiveView() {
        if (loading) {
          return (
            <div className="min-h-[300px] flex items-center justify-center">
              <div className="text-center">
                <span className="material-symbols-outlined spin-soft text-primary text-4xl">progress_activity</span>
                <p className="mt-3 text-sm font-bold text-darkSoft">Loading data...</p>
              </div>
            </div>
          );
        }

        if (activeTab === 'attendance') return renderAttendanceView();
        if (activeTab === 'employees') return renderEmployeeView();
        if (activeTab === 'geofencing') return renderGeofencingView();
        if (activeTab === 'managers') return renderManagerView();

        return renderAttendanceView();
      }

      if (loading && !session) {
        return (
          <div className="min-h-[100dvh] flex items-center justify-center">
            <div className="text-center">
              <span className="material-symbols-outlined spin-soft text-primary text-4xl">progress_activity</span>
              <p className="mt-3 text-sm font-bold text-darkSoft">Loading Admin...</p>
            </div>
          </div>
        );
      }

      if (!session) {
        return (
          <div className="min-h-[100dvh] flex items-center justify-center px-4 sm:px-6">
            <div className="w-full max-w-[420px] rounded-card bg-white shadow-card border border-outline/30 p-6 sm:p-8 text-center">
              <div className="mx-auto w-16 h-16 rounded-2xl bg-[#fff5f4] text-error flex items-center justify-center">
                <span className="material-symbols-outlined text-3xl">lock</span>
              </div>

              <h1 className="mt-5 text-2xl font-black text-dark">Access Locked</h1>

              <p className="mt-2 text-sm text-darkSoft">
                Sesi admin tidak ditemukan. Silakan login dari halaman attendance dengan klik logo 3x.
              </p>

              <button
                onClick={() => {
                  window.location.href = INDEX_PAGE_URL;
                }}
                className="mt-6 w-full rounded-xl bg-primary text-white py-3.5 sm:py-4 font-black"
              >
                Back to Attendance
              </button>
            </div>
          </div>
        );
      }

      return renderPageShell(renderActiveView());
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
